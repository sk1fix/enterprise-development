name: CI 

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ lab_1 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./BikeRentalPoint.sln

      - name: Build solution
        run: dotnet build ./BikeRentalPoint.sln --no-restore

      - name: Run tests
        run: dotnet test ./BikeRentalPoint.Tests/BikeRentalPoint.Tests.csproj --no-build --verbosity detailed